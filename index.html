<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Mave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f5f7; --fg: #1d1d1f; --card: #fff; --muted: #6e6e73;
      --subtle: #86868b; --border: #d2d2d7; --soft: #e8e8ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: Outfit, system-ui, sans-serif;
      background: var(--bg); color: var(--fg); line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky; top: 0; z-index: 20; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; max-width: 720px; margin: 0 auto;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(16px); border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    }
    header .logo { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; text-decoration: none; color: var(--fg); }
    nav.desktop { display: none; gap: 28px; }
    nav.desktop a { font-size: 14px; color: var(--muted); text-decoration: none; }
    nav.desktop a.active, nav.desktop a:hover { color: var(--fg); }
    main { max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 500; letter-spacing: -0.045em; line-height: 1.05; margin: 0 0 12px; }
    h2 { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.03em; margin: 0 0 12px; }
    .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--subtle); margin-bottom: 16px; }
    .lead { color: var(--muted); font-size: 15px; max-width: 28rem; margin-bottom: 32px; }
    .card {
      background: var(--card); border-radius: 16px; padding: 28px 28px;
      box-shadow: 0 1px 0 rgb(0 0 0 / 0.04), 0 12px 32px -24px rgb(0 0 0 / 0.18);
      margin-bottom: 16px;
    }
    .list { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--card); }
    .row {
      display: flex; align-items: center; gap: 16px; padding: 18px 20px;
      border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: color-mix(in srgb, var(--soft) 50%, transparent); }
    .row .meta { flex: 1; min-width: 0; }
    .row .meta p { margin: 0; }
    .row .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .odd { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
    .row .label { font-size: 11px; color: var(--subtle); }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
      padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--fg);
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
    .chip {
      flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: none;
      font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
      background: var(--card); color: var(--muted);
    }
    .chip.on { background: var(--fg); color: var(--bg); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; height: 48px;
      padding: 0 24px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--fg); color: var(--bg); font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; text-decoration: none;
    }
    .btn.outline { background: var(--card); color: var(--fg); }
    .btn.block { width: 100%; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: var(--card); border-radius: 16px; padding: 18px 16px; box-shadow: 0 1px 0 rgb(0 0 0 / 0.04); }
    .stat .k { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--subtle); }
    .stat .v { font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .section { margin-top: 48px; }
    .empty { text-align: center; padding: 48px 24px; }
    .empty p { color: var(--muted); max-width: 22rem; margin: 12px auto 24px; font-size: 14px; }
    .toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
      background: var(--soft); border-radius: 999px; margin-bottom: 16px;
    }
    .toggle button {
      height: 48px; border: none; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .toggle button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 0 rgb(0 0 0 / 0.06); }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--border);
      padding: 0 16px; font-family: inherit; font-size: 15px; background: var(--card); color: var(--fg);
      outline: none;
    }
    .field textarea { height: auto; padding: 12px 16px; min-height: 72px; }
    .field input:focus, .field select:focus, .field textarea:focus { box-shadow: 0 0 0 2px var(--fg); }
    .notice { font-size: 14px; font-weight: 500; margin: 8px 0 16px; }
    .dossier h3 { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--subtle); margin: 20px 0 6px; }
    .dossier p { margin: 0; font-size: 15px; }
    nav.mobile {
      position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
      border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px);
      display: grid; grid-template-columns: repeat(4, 1fr); max-width: 720px; margin: 0 auto;
    }
    nav.mobile a {
      height: 64px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500; color: var(--subtle); text-decoration: none;
    }
    nav.mobile a.active { color: var(--fg); }
    @media (min-width: 768px) {
      nav.desktop { display: flex; }
      nav.mobile { display: none; }
      main { padding-bottom: 48px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
const MATCHES = [
  {
    id: 1, competition: "Saudi Pro League", home: "Al Faisaly", away: "Al-Fateh",
    kickoff: "Aujourd’hui 18:00", status: "WAITING", odd: 1.95, label: "HORS CŒUR — VISIBLE",
    level: "CAUTION", market: "HOME_WIN",
    analysis: {
      overview: "Match pile selon les cotes (2,62 / 3,40 / 2,47). Poisson ~1,25–1,28 xG → 36/27/37. Pas d’avantage net sur le 1N2.",
      home: "Al Faisaly à domicile pousse par les ailes, centres nombreux, finition faible.",
      away: "Al-Fateh en déplacement compact, contre rapide.",
      absences: "Compositions non sorties. Dossier provisoire.",
      risks: "Ligue hors cœur : pas de CHOIX automatique même avec XI.",
      verdict: "PASS. Visible pour lecture, pas pour engager."
    },
    quality: 62, homeXG: 1.25, awayXG: 1.28
  },
  {
    id: 2, competition: "Ligue des champions F.", home: "Wolfsburg F.", away: "Inter Milan F.",
    kickoff: "Aujourd’hui 18:00", status: "WAITING", odd: 2.40, label: "HORS CŒUR — VISIBLE",
    level: "CAUTION", market: "HOME_WIN",
    analysis: {
      overview: "Coupe européenne féminine : variance haute, rotation possible. Hors zone CHOIX auto.",
      home: "Wolfsburg structure forte à domicile sur ce type de match.",
      away: "Inter peut surprendre en transition.",
      absences: "Compositions non sorties.",
      risks: "Coupe = seuils plus durs, pas de mise auto.",
      verdict: "PASS. Dossier de lecture uniquement."
    },
    quality: 58, homeXG: 1.55, awayXG: 1.10
  },
  {
    id: 3, competition: "Meistriliiga", home: "Tammeka", away: "Flora Tallinn",
    kickoff: "Aujourd’hui 18:00", status: "WAITING", odd: 1.55, label: "HORS CŒUR — VISIBLE",
    level: "CAUTION", market: "AWAY_WIN",
    analysis: {
      overview: "Flora favori logique en Estonie. Cote souvent trop courte pour un edge réel.",
      home: "Tammeka peut bloquer mais crée peu.",
      away: "Flora maîtrise le championnat, volume offensif supérieur.",
      absences: "Compositions non sorties.",
      risks: "Hors ligues cœur Mave.",
      verdict: "PASS. Pas de CHOIX hors cœur."
    },
    quality: 55, homeXG: 0.85, awayXG: 1.90
  },
  {
    id: 4, competition: "La Liga", home: "Real Madrid", away: "Real Sociedad",
    kickoff: "Aujourd’hui 21:00", status: "WAITING", odd: 1.24, label: "HORS ZONE DE COTE",
    level: "NO_BET", market: "HOME_WIN",
    analysis: {
      overview: "Favori très court. Même si le modèle aime le Real, la cote 1,24 est hors zone 1,40–2,40.",
      home: "Real Madrid volume et qualité de cadre.",
      away: "Sociedad capable de frustrer mais outsider clair.",
      absences: "Compositions non sorties. Cadres à confirmer.",
      risks: "Prix trop bas : EV négatif dès qu’on collerait 1,24.",
      verdict: "PASS. Hors zone de cote Betclic Mave."
    },
    quality: 78, homeXG: 2.15, awayXG: 0.95
  },
  {
    id: 5, competition: "Championship", home: "Leicester", away: "Coventry",
    kickoff: "Aujourd’hui 20:45", status: "WAITING", odd: null, label: "CANDIDAT",
    level: "PENDING", market: "HOME_WIN",
    analysis: {
      overview: "Leicester favori domicile. Le modèle voit un léger edge si la cote Betclic reste ≥ 1,55 environ. À coller.",
      home: "Leicester plus constant à domicile sur la durée.",
      away: "Coventry peut scorer en transition.",
      absences: "Compositions non sorties.",
      risks: "Sans cote collée = pas de CHOIX. Forme à relire après XI.",
      verdict: "Candidat. Colle la cote Betclic pour valider ou tuer."
    },
    quality: 72, homeXG: 1.55, awayXG: 1.05
  }
];

const state = {
  path: location.hash.replace(/^#/, "") || "/",
  filter: "ALL",
  lineup: {},
  notes: {},
  pastes: {},
  notice: null
};

function save() {
  try {
    localStorage.setItem("mave-web-v1", JSON.stringify({ lineup: state.lineup, notes: state.notes, pastes: state.pastes }));
  } catch (_) {}
}
function load() {
  try {
    const raw = localStorage.getItem("mave-web-v1");
    if (!raw) return;
    const d = JSON.parse(raw);
    state.lineup = d.lineup || {};
    state.notes = d.notes || {};
    state.pastes = d.pastes || {};
  } catch (_) {}
}
load();

function navigate(to) {
  location.hash = to.startsWith("/") ? to : "/" + to;
}
window.addEventListener("hashchange", () => {
  state.path = location.hash.replace(/^#/, "") || "/";
  state.notice = null;
  render();
});

function matchById(id) {
  return MATCHES.find(m => String(m.id) === String(id));
}

function displayed(m) {
  const paste = state.pastes[m.id];
  if (paste) {
    const model = m.market === "HOME_WIN" ? 0.48 : m.market === "AWAY_WIN" ? 0.42 : 0.28;
    const implied = 1 / paste.odd;
    const edge = (model - implied) * 100;
    const ev = (model * paste.odd - 1) * 100;
    const inZone = paste.odd >= 1.4 && paste.odd <= 2.4;
    if (m.competition.includes("La Liga") || m.competition.includes("Championship")) {
      if (inZone && edge >= 4 && ev >= 4) {
        return { label: "CHOIX DE L’IA", level: "SELECT", odd: paste.odd, reason: "Cote collée + seuils." };
      }
      if (inZone && edge > 0) return { label: "PRUDENCE", level: "CAUTION", odd: paste.odd, reason: "Avantage trop faible." };
      return { label: "À ÉVITER", level: "NO_BET", odd: paste.odd, reason: "Pas d’edge après collage." };
    }
    return { label: "HORS CŒUR — VISIBLE", level: "CAUTION", odd: paste.odd, reason: "Ligue hors cœur." };
  }
  return { label: m.label, level: m.level, odd: m.odd, reason: null };
}

function shell(content) {
  const p = state.path;
  const active = (to) => (to === "/" ? p === "/" : p === to || p.startsWith(to + "/")) ? "active" : "";
  return `
    <header>
      <a class="logo" href="#/">Mave</a>
      <nav class="desktop">
        <a class="${active("/")}" href="#/">Scanner</a>
        <a class="${active("/matches")}" href="#/matches">Matchs</a>
        <a class="${active("/portfolio")}" href="#/portfolio">Bilan</a>
        <a class="${active("/stats")}" href="#/stats">Mesure</a>
      </nav>
    </header>
    <main>${content}</main>
    <nav class="mobile">
      <a class="${active("/")}" href="#/">Scanner</a>
      <a class="${active("/matches")}" href="#/matches">Matchs</a>
      <a class="${active("/portfolio")}" href="#/portfolio">Bilan</a>
      <a class="${active("/stats")}" href="#/stats">Mesure</a>
    </nav>
  `;
}

function pageScanner() {
  const selects = MATCHES.filter(m => displayed(m).level === "SELECT");
  const pending = MATCHES.filter(m => displayed(m).level === "PENDING");
  const today = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
  let body = `
    <p class="eyebrow">${today}</p>
    <h1>Un pari, seulement s’il vaut mieux que le marché.</h1>
    <p class="lead">${MATCHES.length} matchs · ${selects.length} choix · ${pending.length} à coller.</p>
  `;
  if (selects.length === 0) {
    body += `
      <div class="card empty">
        <h2>Rien à jouer.</h2>
        <p>${pending.length ? "Le modèle voit des pistes. Ouvre un match, colle la cote Betclic." : "Aucun match ne passe les seuils. Ne rien faire est un choix."}</p>
        <a class="btn outline" href="#/matches">Voir la journée</a>
      </div>`;
  } else {
    body += selects.map(m => cardSelect(m)).join("");
  }
  if (pending.length) {
    body += `<div class="section"><h2>À coller</h2><div class="list">${pending.map(row).join("")}</div></div>`;
  }
  return body;
}

function cardSelect(m) {
  const d = displayed(m);
  return `<a class="card" href="#/matches/${m.id}" style="display:block;text-decoration:none;color:inherit">
    <p class="eyebrow">${m.kickoff}</p>
    <h2>${m.home} — ${m.away}</h2>
    <p style="color:var(--muted);font-size:14px;margin:0 0 12px">${m.competition}</p>
    <p style="color:var(--muted);font-size:14px">${m.analysis.overview}</p>
    <div style="display:flex;justify-content:space-between;align-items:end;margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
      <span class="badge">${d.label}</span>
      <span style="font-size:2rem;font-weight:500;font-variant-numeric:tabular-nums">${d.odd ? d.odd.toFixed(2) : "—"}</span>
    </div>
  </a>`;
}

function row(m) {
  const d = displayed(m);
  const xi = state.lineup[m.id] === "OUT" ? "XI sorti" : "compos en attente";
  return `<a class="row" href="#/matches/${m.id}">
    <div class="meta">
      <p class="title">${m.home} — ${m.away}</p>
      <p class="sub">${m.competition} · ${m.kickoff} · ${xi}</p>
    </div>
    <div>
      <p class="odd">${d.odd ? d.odd.toFixed(2) : "—"}</p>
      <p class="label">${d.label}</p>
    </div>
  </a>`;
}

function pageMatches() {
  const filters = [
    ["ALL", "Tous"], ["SELECT", "Choix"], ["PENDING", "Candidats"], ["CAUTION", "Prudence"], ["NO_BET", "À éviter"]
  ];
  let list = MATCHES.filter(m => {
    if (state.filter === "ALL") return true;
    return displayed(m).level === state.filter;
  });
  return `
    <h1>Journée</h1>
    <p class="lead">Aujourd’hui, pas encore commencés.</p>
    <div class="chips">
      ${filters.map(([id, lab]) => `<button class="chip ${state.filter === id ? "on" : ""}" data-filter="${id}">${lab}</button>`).join("")}
    </div>
    <div class="list">${list.length ? list.map(row).join("") : `<p style="padding:32px;text-align:center;color:var(--muted)">Aucun match pour ce filtre.</p>`}</div>
  `;
}

function pageMatch(id) {
  const m = matchById(id);
  if (!m) return `<p>Match introuvable.</p><a href="#/matches">Retour</a>`;
  const d = displayed(m);
  const out = state.lineup[m.id] === "OUT";
  const note = state.notes[m.id] || "";
  const paste = state.pastes[m.id];
  const analysis = { ...m.analysis };
  if (out) {
    analysis.overview = analysis.overview + " XI officiels : scénario de base conservé" + (note ? " — " + note : ", sans forfait cadre annoncé") + ".";
    analysis.absences = note ? "Feuille : " + note : "Aucun forfait cadre sur la feuille. Banc à surveiller.";
    analysis.verdict = "XI confirmés. " + analysis.verdict;
  }
  return `
    <a href="#/matches" style="font-size:14px;color:var(--muted);text-decoration:none">← Matchs</a>
    <p class="eyebrow" style="margin-top:20px">Match</p>
    <h1 style="font-size:2rem">${m.home} — ${m.away}</h1>
    <p class="lead">${m.competition} · ${m.kickoff}</p>
    <span class="badge">${d.label}</span>
    ${state.notice ? `<p class="notice">${state.notice}</p>` : ""}

    <div class="card" style="margin-top:24px;${out ? "background:#1d1d1f;color:#f5f5f7" : ""}">
      <h2 style="${out ? "color:#f5f5f7" : ""}">Compositions</h2>
      <p style="font-size:14px;opacity:.75;margin:0 0 16px">${out ? "Dossier recalé sur les XI." : "Encore en attente."}</p>
      <div class="toggle" style="${out ? "background:rgba(255,255,255,.12)" : ""}">
        <button class="${!out ? "on" : ""}" data-lineup="WAITING" data-id="${m.id}">Avant XI</button>
        <button class="${out ? "on" : ""}" data-lineup="OUT" data-id="${m.id}">XI sortis</button>
      </div>
      <div class="field">
        <label style="${out ? "color:rgba(245,245,247,.7)" : ""}">Absents / surprises (optionnel)</label>
        <textarea id="note-${m.id}" rows="2" placeholder="ex. cadre titulaire / absent">${note.replace(/</g, "&lt;")}</textarea>
      </div>
      <p style="font-size:16px;font-weight:500;margin:0">${out ? (note ? "XI sortis. Notes : " + note : "XI sortis pour " + m.home + " et " + m.away + ". Dossier actualisé.") : analysis.absences}</p>
    </div>

    <div class="card dossier">
      <h2>Lecture du match</h2>
      <p style="color:var(--muted);font-size:14px;margin:0 0 8px">${out ? "Dossier mis à jour après les XI." : "Dossier avant compos."}</p>
      <h3>Contexte</h3><p>${analysis.overview}</p>
      <h3>${m.home}</h3><p>${analysis.home}</p>
      <h3>${m.away}</h3><p>${analysis.away}</p>
      <h3>Absences</h3><p>${analysis.absences}</p>
      <h3>Risques</h3><p>${analysis.risks}</p>
      <h3>Verdict</h3><p>${analysis.verdict}</p>
    </div>

    <div class="grid2" style="margin:16px 0 24px">
      <div class="stat"><div class="k">xG</div><div class="v">${m.homeXG.toFixed(2)} – ${m.awayXG.toFixed(2)}</div></div>
      <div class="stat"><div class="k">Qualité</div><div class="v">${out ? Math.min(94, m.quality + 10) : m.quality}%</div></div>
    </div>

    <div class="card">
      <h2>Cote Betclic</h2>
      <p style="font-size:14px;color:var(--muted);margin:0 0 12px">Colle la cote du marché retenu. Zone 1,40 – 2,40.</p>
      <div class="field"><label>Cote</label><input id="odd-${m.id}" type="text" inputmode="decimal" placeholder="1.85" value="${paste ? paste.odd.toFixed(2) : (m.odd || "")}" /></div>
      <button class="btn block" data-paste="${m.id}">Recalculer avec cette cote</button>
      ${paste ? `<p class="notice" style="margin-top:12px">Cote collée ${paste.odd.toFixed(2)} · ${d.label}</p>` : ""}
    </div>
  `;
}

function pagePortfolio() {
  return `
    <h1>Bilan</h1>
    <p class="lead">Papier seulement. Pas d’argent réel tant que le modèle n’est pas mesuré.</p>
    <div class="card">
      <h2>Ne pas miser d’argent réel</h2>
      <p style="color:var(--muted);font-size:14px">Échantillon trop faible. La qualité des cotes (CLV) reste à confirmer.</p>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="stat"><div class="k">Settled</div><div class="v">0</div></div>
      <div class="stat"><div class="k">ROI</div><div class="v">0.0%</div></div>
      <div class="stat"><div class="k">CLV</div><div class="v">0.0%</div></div>
      <div class="stat"><div class="k">Seuil</div><div class="v">100</div></div>
    </div>
  `;
}

function pageStats() {
  return `
    <h1>Mesure</h1>
    <p class="lead">Papier. Rien de réel.</p>
    <div class="grid2">
      <div class="stat"><div class="k">Scannés</div><div class="v">${MATCHES.length}</div></div>
      <div class="stat"><div class="k">Choix</div><div class="v">0</div></div>
      <div class="stat"><div class="k">Candidats</div><div class="v">${MATCHES.filter(m => displayed(m).level === "PENDING").length}</div></div>
      <div class="stat"><div class="k">Hors cœur</div><div class="v">${MATCHES.filter(m => displayed(m).level === "CAUTION").length}</div></div>
    </div>
    <p style="margin-top:32px;font-size:12px;color:var(--subtle)">Ces chiffres sont un suivi d’observation. Ils ne justifient pas une mise réelle avant 100 sélections settled avec ROI et CLV positifs.</p>
  `;
}

function render() {
  const p = state.path;
  let content = "";
  const m = p.match(/^\\/matches\\/([^/]+)$/);
  if (p === "/") content = pageScanner();
  else if (p === "/matches") content = pageMatches();
  else if (m) content = pageMatch(m[1]);
  else if (p === "/portfolio") content = pagePortfolio();
  else if (p === "/stats") content = pageStats();
  else content = pageScanner();
  document.getElementById("app").innerHTML = shell(content);
  bind();
}

function bind() {
  document.querySelectorAll("[data-filter]").forEach(el => {
    el.onclick = () => { state.filter = el.dataset.filter; render(); };
  });
  document.querySelectorAll("[data-lineup]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id;
      const status = el.dataset.lineup;
      const ta = document.getElementById("note-" + id);
      if (ta) state.notes[id] = ta.value.trim();
      state.lineup[id] = status;
      state.notice = status === "OUT" ? "XI pris en compte — dossier actualisé." : "Retour au dossier avant compos.";
      save();
      render();
    };
  });
  document.querySelectorAll("[data-paste]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.paste;
      const input = document.getElementById("odd-" + id);
      const odd = Number(String(input.value).replace(",", "."));
      if (!Number.isFinite(odd) || odd <= 1) {
        state.notice = "Cote invalide.";
        render();
        return;
      }
      state.pastes[id] = { odd };
      state.notice = "Cote collée " + odd.toFixed(2) + ".";
      save();
      render();
    };
  });
}

if (!location.hash) location.hash = "/";
render();
  </script>
</body>
</html>
